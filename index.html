<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Solar System by Mtam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff;touch-action:none}
canvas{display:block;touch-action:none}

/* ─── Loading Screen ─── */
#loading{
  position:fixed;inset:0;background:#030308;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
}
#loading h2{
  font-size:2.2rem;font-weight:900;letter-spacing:.25em;
  background:linear-gradient(90deg,#ffd700,#fff8dc,#ffa500);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#loading p{color:rgba(255,220,100,.6);font-size:.85rem;letter-spacing:.2em}
.progress-bar{width:300px;max-width:80vw;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ff8800);
  border-radius:2px;transition:width .2s ease;box-shadow:0 0 10px #ffd700}

/* ─── HUD ─── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .8s}
#hud.visible{opacity:1}

/* Title */
.main-title{position:absolute;top:1rem;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.main-title h1{
  font-size:clamp(1.2rem,3vw,2.5rem);font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  background:linear-gradient(90deg,#ffd700,#fff8dc,#ffe066,#ffaa00);background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shine 5s linear infinite;
  filter:drop-shadow(0 0 18px rgba(255,200,0,.7));
}
.main-title p{font-size:.75rem;font-weight:600;letter-spacing:.3em;color:rgba(255,220,120,.85);margin-top:.2rem}

/* Planet info panel */
#panel{
  position:absolute;right:2rem;top:50%;transform:translateY(-50%);
  width:260px;background:rgba(8,12,28,.92);
  border:1px solid rgba(140,110,255,.4);border-radius:18px;
  padding:1.3rem 1.2rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 0 40px rgba(100,60,255,.25);
  opacity:0;transition:opacity .3s ease, transform .3s ease;pointer-events:none;
}
#panel.show{opacity:1;pointer-events:all;transform:translateY(-50%) scale(1)}
#panel .pname{
  font-size:1.4rem;font-weight:900;margin-bottom:.7rem;
  background:linear-gradient(135deg,#e8d0ff,#a090ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#panel .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(150,100,255,.4),transparent);margin:.5rem 0}
#panel .prow{display:flex;justify-content:space-between;padding:.24rem 0;font-size:.78rem}
#panel .plabel{color:rgba(190,170,255,.6)}
#panel .pval{color:#fff;font-weight:600}
#panel .close-btn{
  position:absolute;top:.7rem;right:.9rem;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(200,180,255,.7);font-size:1.2rem;cursor:pointer;
  border-radius:50%;background:rgba(255,255,255,.06);
  transition:all .2s;
}
#panel .close-btn:hover{color:#fff;background:rgba(255,255,255,.15)}

/* Toggle Info Button & Back Button */
.focus-actions{
  position:absolute;bottom:2rem;right:2rem;
  display:flex;gap:.8rem;pointer-events:all;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.focus-actions.show{opacity:1;pointer-events:all}

.action-btn{
  background:rgba(15,18,36,.88);border:1px solid rgba(160,130,255,.45);
  border-radius:30px;padding:.5rem 1rem;color:#f0e6ff;font-size:.78rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:.4rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(120,80,255,.3);transition:all .25s;
}
.action-btn:hover{background:rgba(40,30,80,.9);border-color:rgba(190,160,255,.8);transform:scale(1.05)}

/* Tooltip (Desktop) */
#tooltip{
  position:absolute;background:rgba(6,9,22,.92);
  border:1px solid rgba(160,130,255,.4);border-radius:10px;
  padding:.55rem 1rem;font-size:.8rem;letter-spacing:.05em;
  pointer-events:none;opacity:0;transition:opacity .2s;
  backdrop-filter:blur(10px);box-shadow:0 0 20px rgba(120,80,255,.35);
}
#tooltip .tname{font-size:1.05rem;font-weight:700;color:#f0e4ff;margin-bottom:.2rem}
#tooltip .tinfo{color:rgba(210,190,255,.75);font-size:.72rem;line-height:1.7}

/* Planet list sidebar */
.planet-list{
  position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.45rem;pointer-events:all;
  max-height:80vh;overflow-y:auto;scrollbar-width:none;
}
.planet-list::-webkit-scrollbar{display:none}

.planet-btn{
  display:flex;align-items:center;gap:.55rem;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:30px;padding:.32rem .8rem .32rem .45rem;
  transition:all .2s;backdrop-filter:blur(8px);
}
.planet-btn:hover,.planet-btn.active{
  background:rgba(150,100,255,.25);border-color:rgba(170,120,255,.7);
  box-shadow:0 0 12px rgba(150,100,255,.35);transform:translateX(4px);
}
.planet-btn .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.planet-btn .bname{font-size:.72rem;color:rgba(255,255,255,.8);letter-spacing:.03em;font-weight:500}

/* Speed control */
.speed-wrap{
  position:absolute;left:1.5rem;bottom:2.5rem;
  display:flex;flex-direction:column;gap:.4rem;align-items:center;
}
.speed-wrap label{font-size:.62rem;letter-spacing:.15em;color:rgba(255,255,255,.45);font-weight:600}
#speedSlider{
  pointer-events:all;-webkit-appearance:none;width:115px;height:4px;
  border-radius:2px;background:rgba(160,110,255,.4);outline:none;cursor:pointer;
}
#speedSlider::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#b794f4;box-shadow:0 0 10px #b794f4;cursor:pointer;
}
.speed-val{font-size:.62rem;color:rgba(210,190,255,.6);letter-spacing:.1em;font-weight:600}

/* Bottom hints */
.hints{
  position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
  display:flex;gap:1.2rem;
}
.hint-pill{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:.3rem .85rem;
  font-size:.64rem;letter-spacing:.12em;color:rgba(255,255,255,.5);
}

.fps{position:absolute;top:1rem;right:1.5rem;font-size:.7rem;
  color:rgba(120,255,160,.6);letter-spacing:.1em;font-weight:600}

/* ══════════════════════════════════════════
   MOBILE RESPONSIVE (TỐI ƯU ĐIỆN THOẠI)
══════════════════════════════════════════ */
@media (max-width: 768px) {
  .hints, .speed-wrap { display: none !important; }
  
  .main-title { top: 0.6rem; }
  .main-title h1 { font-size: 1.25rem; letter-spacing: .15em; }
  .main-title p { font-size: .65rem; }
  .fps { top: 0.6rem; right: 0.8rem; font-size: .62rem; }

  /* Danh sách hành tinh: chuyển thành hàng ngang cuộn ở sát trên */
  .planet-list {
    top: 4.2rem;
    left: 0.8rem;
    right: 0.8rem;
    transform: none;
    flex-direction: row;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 4px;
    gap: 0.4rem;
  }
  .planet-btn {
    flex-shrink: 0;
    padding: .28rem .65rem .28rem .4rem;
  }
  .planet-btn .bname { font-size: .66rem; }

  /* Bảng thông tin: chuyển thành Bottom Sheet ở đáy màn hình, không che hành tinh */
  #panel {
    top: auto;
    bottom: 1rem;
    right: 50%;
    transform: translateX(50%) translateY(20px);
    width: calc(100% - 2rem);
    max-width: 340px;
    padding: 1.1rem 1rem;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px rgba(120,80,255,.3);
  }
  #panel.show {
    transform: translateX(50%) translateY(0);
  }
  #panel .pname { font-size: 1.25rem; margin-bottom: .4rem; }
  #panel .prow { padding: .18rem 0; font-size: .72rem; }

  /* Các nút hành động trên điện thoại */
  .focus-actions {
    bottom: 1.2rem;
    right: 50%;
    transform: translateX(50%);
    gap: 0.6rem;
  }
  .action-btn {
    padding: .45rem .85rem;
    font-size: .74rem;
  }
}

@keyframes shine{0%{background-position:0%}100%{background-position:300%}}

import {RenderPass}      from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ══════════════════════════════════════════
   RENDERER & CAMERA
══════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,8000);
camera.position.set(0,95,230);

/* POST PROCESSING (BLOOM) */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.75, 0.4, 0.2);
composer.addPass(bloom);

/* CONTROLS */
const ctrl = new OrbitControls(camera,renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.05;
ctrl.autoRotate = true;
ctrl.autoRotateSpeed = 0.08;
ctrl.minDistance = 5;
ctrl.maxDistance = 1400;
ctrl.zoomSpeed = 1.25;

/* ══════════════════════════════════════════
   TEXTURE LOADER
══════════════════════════════════════════ */
const loader = new THREE.TextureLoader();
const progEl = document.getElementById('prog');
const msgEl  = document.getElementById('loadMsg');
const TEX_NAMES = [
  'sun','mercury','venus','earth_day','earth_night','earth_clouds',
  'mars','jupiter','saturn','uranus','neptune','stars'
];
const TEX = {};
let loadedCount = 0;

function loadAllTextures(){
  return new Promise(resolve=>{
    const total = TEX_NAMES.length;
    TEX_NAMES.forEach(name=>{
      loader.load(`textures/${name}.jpg`, tex=>{
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        TEX[name] = tex;
        loadedCount++;
        progEl.style.width = `${(loadedCount/total)*100}%`;
        msgEl.textContent = `Tải hoàn tất: ${name} (${loadedCount}/${total})`;
        if(loadedCount === total) resolve();
      }, undefined, ()=>{
        loadedCount++;
        progEl.style.width = `${(loadedCount/total)*100}%`;
        if(loadedCount === total) resolve();
      });
    });
  });
}

/* ══════════════════════════════════════════
   VÀNH ĐAI SAO THỔ NHƯ LÚC BAN ĐẦU
   Mềm mại, trong suốt, màu be vàng cát tự nhiên
══════════════════════════════════════════ */
function texSaturnRingOriginal(){
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 64;
  const ctx = c.getContext('2d');

  const rings = [
    { x: 0,   w: 80,  col: 'rgba(200,180,140,0.05)' },
    { x: 80,  w: 60,  col: 'rgba(210,190,150,0.25)' },
    { x: 140, w: 120, col: 'rgba(220,200,160,0.45)' },
    { x: 260, w: 40,  col: 'rgba(180,160,120,0.15)' },
    { x: 300, w: 150, col: 'rgba(215,195,155,0.55)' },
    { x: 450, w: 30,  col: 'rgba(170,150,110,0.08)' },
    { x: 480, w: 200, col: 'rgba(210,190,150,0.35)' },
    { x: 680, w: 80,  col: 'rgba(190,170,130,0.20)' },
    { x: 760, w: 100, col: 'rgba(205,185,145,0.28)' },
    { x: 860, w: 80,  col: 'rgba(180,160,120,0.15)' },
    { x: 940, w: 84,  col: 'rgba(200,180,140,0.08)' }
  ];

  rings.forEach(r => {
    ctx.fillStyle = r.col;
    ctx.fillRect(r.x, 0, r.w, 64);
  });

  for(let x=0; x<1024; x++){
    const n = Math.random();
    ctx.fillStyle = `rgba(220,200,160,${n * 0.10})`;
    ctx.fillRect(x, 0, 1, 64);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ══════════════════════════════════════════
   ATMOSPHERE GLOW
══════════════════════════════════════════ */
function createAtmosphereGlow(radius, hexColor){
  const vs = `
    varying vec3 vNormal;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const fs = `
    uniform vec3 uColor;
    varying vec3 vNormal;
    void main(){
      float rim = 1.0 - clamp(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0);
      float alpha = pow(rim, 3.2) * 0.70;
      gl_FragColor = vec4(uColor, alpha);
    }
  `;
  return new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.025, 64, 64),
    new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(hexColor) } },
      vertexShader: vs, fragmentShader: fs,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.BackSide
    })
  );
}

/* ══════════════════════════════════════════
   SCENE BUILDER
══════════════════════════════════════════ */
async function buildScene(){
  await loadAllTextures();

  /* ── 1. Milky Way Skybox ── */
  TEX.stars.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = TEX.stars;
  scene.backgroundIntensity = 0.55;

  /* ── 2. Star Particles ── */
  {
    const N = 12000;
    const pos = new Float32Array(N*3);
    const col = new Float32Array(N*3);
    const starColors = [
      new THREE.Color('#ffffff'), new THREE.Color('#d0e0ff'),
      new THREE.Color('#ffe8cc'), new THREE.Color('#e2d0ff')
    ];
    for(let i=0; i<N; i++){
      const i3 = i*3, r = 600 + Math.random()*2200;
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      pos[i3]   = r * Math.sin(ph) * Math.cos(th);
      pos[i3+1] = r * Math.cos(ph);
      pos[i3+2] = r * Math.sin(ph) * Math.sin(th);
      const c = starColors[Math.floor(Math.random()*starColors.length)];
      col[i3] = c.r; col[i3+1] = c.g; col[i3+2] = c.b;
    }
    const bgGeo = new THREE.BufferGeometry();
    bgGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    bgGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({
      size: 0.35, sizeAttenuation: true, vertexColors: true,
      depthWrite: false, blending: THREE.AdditiveBlending
    })));
  }

  /* ── 3. SUN (MẶT TRỜI) ── */
  const sunMat = new THREE.MeshBasicMaterial({ map: TEX.sun });
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(12, 96, 96), sunMat);
  scene.add(sunMesh);

  // Halo Glow Mặt Trời
  [
    { r: 12.8, c: '#ffeedd', op: 0.38 },
    { r: 14.2, c: '#ffb544', op: 0.22 },
    { r: 17.5, c: '#ff7700', op: 0.10 },
    { r: 23.0, c: '#ff4400', op: 0.04 }
  ].forEach(h => {
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(h.r, 48, 48),
      new THREE.MeshBasicMaterial({
        color: h.c, transparent: true, opacity: h.op,
        depthWrite: false, blending: THREE.AdditiveBlending
      })
    ));
  });

  /* ── 4. ÁNH SÁNG ── */
  const sunLight = new THREE.PointLight(0xffffff, 3.5, 0, 0);
  scene.add(sunLight);
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
  scene.add(ambientLight);

  /* ── 5. VÀNH ĐAI TIỂU HÀNH TINH (ASTEROID BELT) ── */
  let asteroidSystem;
  {
    const N = 4000;
    const pos = new Float32Array(N*3);
    const col = new Float32Array(N*3);
    for(let i=0; i<N; i++){
      const i3 = i*3;
      const r = 118 + Math.random()*24;
      const th = Math.random()*Math.PI*2;
      const yy = (Math.random()-0.5)*3.5;
      pos[i3]   = r * Math.cos(th);
      pos[i3+1] = yy;
      pos[i3+2] = r * Math.sin(th);
      const v = 0.35 + Math.random()*0.45;
      col[i3] = v * 0.9; col[i3+1] = v * 0.8; col[i3+2] = v * 0.7;
    }
    const aGeo = new THREE.BufferGeometry();
    aGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    aGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
    asteroidSystem = new THREE.Points(aGeo, new THREE.PointsMaterial({
      size: 0.18, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending
    }));
    scene.add(asteroidSystem);
  }

  /* ── 6. KHỞI TẠO CÁC HÀNH TINH ── */
  const orbitObjs = [];
  const saturnRingTex = texSaturnRingOriginal();

  PLANETS.forEach(d => {
    const oPts = [];
    for(let i=0; i<=128; i++){
      const a = (i/128)*Math.PI*2;
      oPts.push(new THREE.Vector3(Math.cos(a)*d.dist, 0, Math.sin(a)*d.dist));
    }
    const oGeo = new THREE.BufferGeometry().setFromPoints(oPts);
    const oLine = new THREE.Line(
      oGeo,
      new THREE.LineBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.08
      })
    );
    scene.add(oLine);

    const pivot = new THREE.Object3D();
    pivot.rotation.y = Math.random()*Math.PI*2;
    scene.add(pivot);

    let mesh;
    if(d.isEarth){
      const earthMat = new THREE.MeshStandardMaterial({
        map: TEX.earth_day,
        emissiveMap: TEX.earth_night,
        emissive: new THREE.Color(0xffe090),
        emissiveIntensity: 0.45,
        roughness: 0.65,
        metalness: 0.05
      });
      mesh = new THREE.Mesh(new THREE.SphereGeometry(d.radius, 96, 96), earthMat);

      const cloudMat = new THREE.MeshStandardMaterial({
        map: TEX.earth_clouds,
        transparent: true,
        opacity: 0.48,
        depthWrite: false
      });
      const clouds = new THREE.Mesh(new THREE.SphereGeometry(d.radius * 1.018, 96, 96), cloudMat);
      mesh.add(clouds);
      mesh.userData.clouds = clouds;

      const moonPivot = new THREE.Object3D();
      mesh.add(moonPivot);
      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.75, 48, 48),
        new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 })
      );
      moonMesh.position.x = d.radius * 2.2;
      moonPivot.add(moonMesh);
      mesh.userData.moonPivot = moonPivot;
    } else {
      const pMat = new THREE.MeshStandardMaterial({
        map: TEX[d.id],
        roughness: 0.75,
        metalness: 0.05
      });
      mesh = new THREE.Mesh(new THREE.SphereGeometry(d.radius, 96, 96), pMat);
    }

    mesh.rotation.z = THREE.MathUtils.degToRad(d.tilt || 0);
    mesh.position.x = d.dist;
    mesh.userData.pd = d;
    pivot.add(mesh);

    if(d.atmoColor){
      const atm = createAtmosphereGlow(d.radius, d.atmoColor);
      mesh.add(atm);
    }

    // VÀNH ĐAI SAO THỔ BAN ĐẦU
    if(d.hasRings){
      const rInner = d.radius * 1.25;
      const rOuter = d.radius * 2.45;
      const rGeo = new THREE.RingGeometry(rInner, rOuter, 120);

      const pos2 = rGeo.attributes.position, uv = rGeo.attributes.uv;
      for(let i=0; i<pos2.count; i++){
        const v = new THREE.Vector3().fromBufferAttribute(pos2, i);
        uv.setXY(i, (v.length() - rInner) / (rOuter - rInner), 0);
      }
      rGeo.attributes.uv.needsUpdate = true;

      const rMat = new THREE.MeshBasicMaterial({
        map: saturnRingTex,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const ring = new THREE.Mesh(rGeo, rMat);
      ring.rotation.x = Math.PI / 2;
      mesh.add(ring);

      const rg2 = new THREE.RingGeometry(d.radius * 1.22, d.radius * 2.48, 120);
      const rm2 = new THREE.MeshBasicMaterial({
        color: 0xe0d0b0,
        transparent: true,
        opacity: 0.06,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const ring2 = new THREE.Mesh(rg2, rm2);
      ring2.rotation.x = Math.PI / 2;
      mesh.add(ring2);
    }

    // VÀNH ĐAI SAO THIÊN VƯƠNG
    if(d.hasRingsU){
      [1.35, 1.5, 1.65].forEach((rf, i) => {
        const rg = new THREE.RingGeometry(d.radius * rf, d.radius * (rf + 0.04), 128);
        const rMesh = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
          color: 0x88ddee,
          transparent: true,
          opacity: 0.12 - i * 0.03,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        }));
        rMesh.rotation.x = Math.PI / 2;
        mesh.add(rMesh);
      });
    }

    // 4 Mặt trăng lớn của Sao Mộc
    if(d.hasGalilean){
      const moons = [
        { r: 0.55, dist: d.radius * 1.8, sp: 2.2, c: 0xe0d060 },
        { r: 0.48, dist: d.radius * 2.4, sp: 1.6, c: 0xd0c0a0 },
        { r: 0.75, dist: d.radius * 3.2, sp: 1.0, c: 0xa09888 },
        { r: 0.70, dist: d.radius * 4.3, sp: 0.65, c: 0x807870 }
      ];
      moons.forEach((m, mi) => {
        const mp = new THREE.Object3D();
        mesh.add(mp);
        const mm = new THREE.Mesh(
          new THREE.SphereGeometry(m.r, 32, 32),
          new THREE.MeshStandardMaterial({ color: m.c, roughness: 0.85 })
        );
        mm.position.x = m.dist;
        mp.add(mm);
        mesh.userData[`galMoon_${mi}`] = { pivot: mp, speed: m.sp };
      });
    }

    orbitObjs.push({ pivot, mesh, data: d, angle: pivot.rotation.y });
  });

  /* ── 7. DANH SÁCH BÊN TRÁI ── */
  const listEl = document.getElementById('planetList');
  PLANETS.forEach((d,i)=>{
    const btn = document.createElement('div');
    btn.className = 'planet-btn';
    btn.innerHTML = `
      <div class="dot" style="background:${d.dotColor};box-shadow:0 0 7px ${d.dotColor}"></div>
      <span class="bname">${d.name}</span>
    `;
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      focusPlanet(i);
    });
    listEl.appendChild(btn);
    d._btn = btn;
  });

  /* ── 8. THÔNG TIN CHI TIẾT & CAMERA FOCUS ── */
  const panelEl = document.getElementById('panel');
  const tooltip = document.getElementById('tooltip');
  const focusActionsEl = document.getElementById('focusActions');
  const toggleInfoBtn = document.getElementById('toggleInfoBtn');
  const backOverviewBtn = document.getElementById('backOverviewBtn');
  const closeBtn = document.getElementById('closeBtn');

  let focusedIdx = -1;
  let focusTarget = null;
  let isZooming = false;
  let targetCamPos = new THREE.Vector3();

  // NÚT ✕: CHỈ ĐÓNG BẢNG THÔNG TIN, KHÔNG VĂNG RA KHỎI HÀNH TINH!
  closeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panelEl.classList.remove('show');
    toggleInfoBtn.textContent = 'ℹ️ Xem thông tin';
  });

  // NÚT BẬT/TẮT THÔNG TIN:
  toggleInfoBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(panelEl.classList.contains('show')){
      panelEl.classList.remove('show');
      toggleInfoBtn.textContent = 'ℹ️ Xem thông tin';
    } else {
      panelEl.classList.add('show');
      toggleInfoBtn.textContent = '👁️ Ẩn thông tin';
    }
  });

  // NÚT TOÀN CẢNH: CHỈ KHI BẤM NÚT NÀY MỚI QUAY LẠI TOÀN CẢNH!
  backOverviewBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    unfocus();
  });

  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') unfocus(); });

  function showPanel(d){
    document.getElementById('pan-name').textContent = d.name;
    document.getElementById('pan-diam').textContent = d.diam;
    document.getElementById('pan-period').textContent = d.period;
    document.getElementById('pan-dist').textContent = d.distS;
    document.getElementById('pan-temp').textContent = d.temp;
    document.getElementById('pan-moon').textContent = d.moons;
    document.getElementById('pan-grav').textContent = d.grav;
    document.getElementById('pan-fact').textContent = d.fact;
    panelEl.classList.add('show');
    focusActionsEl.classList.add('show');
    toggleInfoBtn.textContent = '👁️ Ẩn thông tin';
  }

  function focusPlanet(idx){
    focusedIdx = idx;
    const obj = orbitObjs[idx];
    focusTarget = obj.mesh;
    isZooming = true;
    showPanel(obj.data);
    ctrl.autoRotate = false;
    document.querySelectorAll('.planet-btn').forEach((b,i)=>
      b.classList.toggle('active', i === idx)
    );

    const wp = new THREE.Vector3();
    focusTarget.getWorldPosition(wp);
    const toSun = new THREE.Vector3(0,0,0).sub(wp).normalize();
    const perp = new THREE.Vector3(-toSun.z, 0.45, toSun.x).normalize();
    const camDist = obj.data.hasRings ? obj.data.radius * 4.8 : obj.data.radius * 4.2;
    targetCamPos.copy(wp).addScaledVector(toSun, camDist * 0.75).addScaledVector(perp, camDist * 0.75);
    targetCamPos.y += obj.data.radius * 1.6;
  }

  function unfocus(){
    focusedIdx = -1;
    focusTarget = null;
    isZooming = false;
    panelEl.classList.remove('show');
    focusActionsEl.classList.remove('show');
    ctrl.autoRotate = true;
    ctrl.target.set(0,0,0);
    document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
  }

  /* ── 9. CLICK & HOVER TƯƠNG TÁC ── */
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const allPlanetMeshes = orbitObjs.map(o => o.mesh);

  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allPlanetMeshes, false);
    if(hits.length){
      const d = hits[0].object.userData.pd;
      renderer.domElement.style.cursor = 'pointer';
      tooltip.style.opacity = '1';
      tooltip.style.left = (e.clientX + 18) + 'px';
      tooltip.style.top  = (e.clientY - 12) + 'px';
      document.getElementById('tip-name').textContent = d.name;
      document.getElementById('tip-info').innerHTML =
        `📏 ${d.diam} &nbsp;|&nbsp; 🌡 ${d.temp}<br>🛸 ${d.moons} mặt trăng &nbsp;|&nbsp; ↕ ${d.grav}`;
    } else {
      renderer.domElement.style.cursor = 'default';
      tooltip.style.opacity = '0';
    }
  });

  window.addEventListener('click', (e) => {
    // Không bắt sự kiện khi click vào các nút HUD
    if(e.target.closest('#panel') || e.target.closest('#planetList') || e.target.closest('#focusActions') || e.target.closest('.speed-wrap')) return;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allPlanetMeshes, false);
    if(hits.length){
      const idx = allPlanetMeshes.indexOf(hits[0].object);
      if(idx >= 0) focusPlanet(idx);
    }
  });

  /* ── 10. ĐIỀU CHỈNH TỐC ĐỘ ── */
  let speedMult = 1.0;
  const speedSlider = document.getElementById('speedSlider');
  const speedValEl  = document.getElementById('speedVal');
  speedSlider.addEventListener('input', e => {
    speedMult = parseFloat(e.target.value);
    speedValEl.textContent = speedMult.toFixed(1) + '×';
  });

  /* ── 11. RESIZE ── */
  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });

  /* ── HIỆN GIAO DIỆN ── */
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').classList.add('visible');

  /* ══════════════════════════════════════════
     ANIMATION LOOP
  ══════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let frameCount = 0, lastTime = performance.now();
  const fpsEl = document.getElementById('fpsEl');

  function tick(){
    requestAnimationFrame(tick);
    const dt = clock.getDelta();

    frameCount++;
    if(performance.now() - lastTime >= 1000){
      fpsEl.textContent = frameCount + ' FPS';
      frameCount = 0;
      lastTime = performance.now();
    }

    sunMesh.rotation.y += dt * 0.04;

    if(asteroidSystem){
      asteroidSystem.rotation.y += dt * 0.012 * speedMult;
    }

    orbitObjs.forEach(obj => {
      obj.angle += dt * obj.data.speed * 0.009 * speedMult;
      obj.pivot.rotation.y = obj.angle;
      obj.mesh.rotation.y += dt * obj.data.selfRot * speedMult;

      if(obj.mesh.userData.clouds){
        obj.mesh.userData.clouds.rotation.y += dt * 0.03 * speedMult;
      }
      if(obj.mesh.userData.moonPivot){
        obj.mesh.userData.moonPivot.rotation.y += dt * 1.4 * speedMult;
      }
      for(let i=0; i<4; i++){
        const gm = obj.mesh.userData[`galMoon_${i}`];
        if(gm) gm.pivot.rotation.y += dt * gm.speed * 1.2 * speedMult;
      }
    });

    if(focusTarget){
      const currentWP = new THREE.Vector3();
      focusTarget.getWorldPosition(currentWP);

      if(isZooming){
        camera.position.lerp(targetCamPos, 0.05);
        ctrl.target.lerp(currentWP, 0.08);
        if(camera.position.distanceTo(targetCamPos) < 1.0){
          isZooming = false;
        }
      } else {
        ctrl.target.lerp(currentWP, 0.08);
      }
    }

    ctrl.update();
    composer.render();
  }
  tick();
}

buildScene();
</script>
</body>
</html>
